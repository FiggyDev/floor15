name: Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          F15_MIRROR_DIR: .disabled-preview-mirror
      - run: npm audit --audit-level=moderate
